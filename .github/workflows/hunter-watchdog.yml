name: XPE Hunter Watchdog
on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas revisa que el hunter siga vivo
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revisar ultimas corridas del hunter
        env:
          GH_TOKEN: ${{ github.token }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/hunter.yml/runs?per_page=6" --jq '[.workflow_runs[] | select(.status=="completed")] | map(.conclusion)')
          echo "ultimas corridas: $RUNS"
          FAILS=$(echo "$RUNS" | jq '[.[] | select(. != "success")] | length')
          TOTAL=$(echo "$RUNS" | jq 'length')
          # reactivar el workflow si GitHub lo desactivo por inactividad
          gh workflow enable hunter.yml 2>/dev/null || true
          if [ "$TOTAL" -eq 0 ] || [ "$FAILS" -ge 3 ]; then
            gh workflow run hunter.yml 2>/dev/null || true
            curl -s -X POST https://api.brevo.com/v3/smtp/email \
              -H "api-key: $BREVO_API_KEY" -H "Content-Type: application/json" \
              -d "{\"sender\":{\"name\":\"XPE Watchdog\",\"email\":\"$SENDER_EMAIL\"},\"to\":[{\"email\":\"$ALERT_EMAIL\"}],\"subject\":\"⚠️ El hunter de Oracle necesita atencion\",\"htmlContent\":\"<p>El hunter fallo $FAILS de las ultimas $TOTAL corridas (o no ha corrido). Ya lo relance. Revisa: https://github.com/${{ github.repository }}/actions</p><p>XPE Watchdog ⭐</p>\"}"
          fi
